{% extends "base.html" %}

{% block app_content %}
<h1>Maturity Levels</h1>
<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
        </tr>
    </thead>
    <tbody>
        {% for level in levels %}
        <tr>
            <td>{{ level.id }}</td>
            <td>{{ level.name }}</td>
            <td>{{ level.description }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
